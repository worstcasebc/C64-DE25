# mini.cfg — Linker-Konfiguration (ld65) für das Mini-System.
# Sagt dem Linker, wo RAM und ROM liegen (siehe rtl/mem/addr_decode.v).
# Die Ausgabedatei enthält genau das 8-KB-ROM $E000-$FFFF.

MEMORY {
    ZP:  start = $0002, size = $00FE, type = rw, file = "";
    RAM: start = $0200, size = $7E00, type = rw, file = "";
    ROM: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    VECTORS:  load = ROM, type = ro, start = $FFFA;
}
