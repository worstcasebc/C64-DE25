# c64.cfg — Linker-Konfiguration (ld65) für die C64-Speicherkarte.
# Sagt dem Linker, wo RAM und die drei ROMs liegen (siehe
# rtl/mem/c64_addr_decode.v). Die Ausgabedatei enthält die ROMs direkt
# hintereinander: BASIC (8 KB), Char-ROM (4 KB), KERNAL (8 KB).
# sw/py/build_rom.py zerlegt sie in drei Hex-Dateien.

MEMORY {
    ZP:     start = $0002, size = $00FE, type = rw, file = "";
    RAM:    start = $0200, size = $9E00, type = rw, file = "";
    BASIC:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHAR:   start = $D000, size = $1000, type = ro, file = %O, fill = yes, fillval = $FF;
    KERNAL: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, optional = yes;
    BASIC:    load = BASIC,  type = ro;
    CHARROM:  load = CHAR,   type = ro;
    CODE:     load = KERNAL, type = ro;
    RODATA:   load = KERNAL, type = ro;
    VECTORS:  load = KERNAL, type = ro, start = $FFFA;
}
